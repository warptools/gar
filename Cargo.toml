[workspace]
resolver = "2"
members = [
	"crates/gittree",
	"crates/gar",
	"crates/gar-cli",
	"crates/experiments",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
sha2 = "*"
hex = "*"
bytes = "*"
tempdir = "*"
clap = { version = "*", features = ["derive"] }
io_tee = "*"
rstest = "*"
criterion = "*"
